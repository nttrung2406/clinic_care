[project]
name = "clinic_care_service"
version = "1.0.0"
description = "clinic_care_service"
requires-python = ">=3.12"
dependencies = [
    "loguru",
    "numpy==2.2.6",
    "fastapi[standard]==0.136.0",
    "fastapi-pagination==0.15.12",
    "uvicorn[standard]==0.44.0",
    "httptools==0.7.1",
    "python-dotenv==1.2.2",
    "pydantic==2.12.5",
    "parsel==1.11.0",
    "sqlmodel==0.0.38",
    "psycopg[binary]==3.2.4",
    "alembic==1.16.1",
    "pyjwt==2.10.1",
    "bcrypt==4.2.1",
    "tenacity==9.1.4",
    "orjson==3.11.8",
    "openpyxl==3.1.5",
    "tiktoken==0.11.0",
    "aiokafka==0.12.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0", 
    "urllib3>=1.26.0",
    "uvloop==0.22.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["src"]
exclude = ["tests", "migrations"]
reportMissingImports = true
reportMissingTypeStubs = false
