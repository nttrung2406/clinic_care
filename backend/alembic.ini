[alembic]
# path to migration scripts (shared with the database/ compose stack).
# Resolves to ../database/migrations relative to this file; that directory
# is bind-mounted to /database/migrations inside the container.
script_location = %(here)s/../database/migrations

# version path separator
version_path_separator = os

# timezone to use when rendering the date within the migration file
# as well as the filename.
timezone = UTC

# sqlalchemy.url is intentionally omitted here; it is set at runtime
# in migrations/env.py from the DATABASE_URL environment variable.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
