services:
  clinic_care_service:
    # image: ${REGISTRY_URL}/${IMAGE_NAME}:${IMAGE_TAG:-latest}
    build: .
    container_name: clinic_care_service
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    ports:
      - "8090:8090"
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=DEBUG
      - HTTP_DEFAULT_TIMEOUT=60.0
      - HTTP_MAX_CONCURRENT=10
      - CACHE_MAX_SIZE=10000
      - CACHE_TTL_SECONDS=3600
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./main.py:/app/main.py:ro
      - ./src:/app/src:ro
      - ./config:/app/config:ro
      - ./alembic.ini:/app/alembic.ini:ro
      - ../database/migrations:/database/migrations:ro
    networks:
      - network
    extra_hosts:
      - "docker.internal:127.0.0.1"


networks:
  network:
    name: clinic_care_network
    external: true

